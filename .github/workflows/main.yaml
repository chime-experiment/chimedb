name: chimedb-ci-build
on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main

jobs:

  black-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Install black
      run: pip install black

    - name: Check code with black
      run: |
        black --check .

  ruff-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Install chimedb.core
      run: pip install .

    - name: Install ruff
      run: pip install ruff

    - name: Check code with ruff
      run: ruff check .

  run-tests:
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

      # Set up SSH so the tunnel test can ssh to localhost.
    - name: Install OpenSSH
      run: sudo apt-get install openssh-server openssh-client

    - name: Create user ssh directory
      run: mkdir ~/.ssh && chmod -c 0700 ~/.ssh

    - name: Create SSH key
      run: ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519

    - name: Create authorized_keys
      run: |
        cp ~/.ssh/id_ed25519.pub ~/.ssh/authorized_keys
        chmod -c 0600 ~/.ssh/authorized_keys

    - name: Create known_hosts file
      run: |
        touch ~/.ssh/known_hosts
        chmod -c 0600 ~/.ssh/known_hosts
        ssh 127.0.0.1 -oStrictHostKeyChecking=accept-new /bin/true

    - name: Install chimedb
      run: pip install .[test]

    - name: Run tests
      run: pytest -sv .
